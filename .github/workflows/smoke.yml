# Renders two frames of the starter film on every push, so a broken engine is caught early.
name: smoke
on: [push, pull_request]
jobs:
  still:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm install
      - run: pip install playwright pillow
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tools/still.py starter intro:5 numbers:6.5 --out still.jpg
      - uses: actions/upload-artifact@v4
        with: { name: still, path: still.jpg }
